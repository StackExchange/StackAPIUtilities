name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: stack-api-utilities:ci
      - name: Smoke-test hardened container
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 3000:3000 \
            --read-only --tmpfs /tmp --tmpfs /app/.next/cache:uid=10001,gid=10001 \
            --cap-drop ALL --security-opt no-new-privileges \
            stack-api-utilities:ci
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/healthz && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1
